services:
  postgres:
    # timescaledb-ha bundles both TimescaleDB and pgvector on pg17.
    image: timescale/timescaledb-ha:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: discord_scraper
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: discord
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord -d discord_scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    # Docker's default soft nofile is 1024; mongod's listener exhausts that under
    # legitimate load (driver pool + monitoring + WiredTiger data files + listener
    # sockets) and WiredTiger fasserts on accept(). 64000 is MongoDB's own
    # recommendation in production deployments.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      # Basic connectivity check — `db.runCommand({ping:1}).ok` returns 1 once mongod accepts
      # connections, even before rs.initiate() runs. The replica set itself is initialized by
      # the mongo-init container; downstream services depend on mongo-init's successful
      # completion (service_completed_successfully) rather than mongo's healthy state.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    # One-shot container that initiates the replica set, then exits. Idempotent — re-runs
    # against an initialized RS are no-ops because rs.status() succeeds.
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"

  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.2
    ports:
      - "18888:18888"
      - "18889:18889"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  ingester:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingester
    environment:
      Discord__BotToken: ${DISCORD_BOT_TOKEN:-}
      Discord__BackfillSinceUtc: ${DISCORD_BACKFILL_SINCE_UTC:-}
      Postgres__ConnectionString: "Host=postgres;Port=5432;Database=discord_scraper;Username=discord;Password=discord"
      Mongo__ConnectionString: "mongodb://mongo:27017/?replicaSet=rs0"
      RabbitMq__Host: "amqp://rabbitmq:5672"
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Ollama__Embedding__BaseUrl: "http://host.docker.internal:11434"
      Ollama__Embedding__Model: "nomic-embed-text"
      Ollama__Tagging__BaseUrl: "http://host.docker.internal:11434"
      Ollama__Tagging__Model: "llama3.1:8b"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "5000:5000"
    environment:
      Postgres__ConnectionString: "Host=postgres;Port=5432;Database=discord_scraper;Username=discord;Password=discord"
      Mongo__ConnectionString: "mongodb://mongo:27017/?replicaSet=rs0"
      RabbitMq__Host: "amqp://rabbitmq:5672"
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    depends_on:
      postgres:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

volumes:
  pgdata:
  mongodata:
